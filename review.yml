    x-source-url: https://www.rcac.purdue.edu/api
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before any contract is saved. The June 2026 profile credited Purdue with ten separate
      APIs; all ten were one community-built third-party OData contract (api.purdue.io) split by
      tag, and every schema, structure, example, rule, vocabulary, JSON-LD context, agentic-access
      profile, capability map and collection in the repository was derived from it. 48 files were
      removed and the relationship kept as a single tenant entry. In their place, two genuinely
      institution-operated contracts were found and verified: Purdue RCAC publishes its own
      OpenAPI 3.0.0 (206 paths, 452 operations) at www.rcac.purdue.edu/api, and Housing and Food
      Services runs an open keyless dining menus API at api.hfs.purdue.edu/menus/v2. Two further
      institution-operated surfaces were confirmed - the PURR OAI-PMH endpoint and Purdue's own
      InCommon-registered Shibboleth identity provider. Three surfaces are recorded as tenant
      relationships: Purdue e-Pubs on bepress Digital Commons, the events calendar on Localist,
      and Purdue.io. The Purdue Libraries API host still serves only a placeholder.
    endpoints:
