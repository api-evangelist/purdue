          default: label
          enum:
          - id
          - name
          - label
          - created_at
          - deleted_at
      - in: query
        name: order_dir
        description: Direction to sort results by.
        type: string
        required: false
        default: desc
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Finder
      summary: Get finder fields
      x-summary-source: derived
      operationId: getFinderFields
      x-operation-id-source: derived
    post:
      description: Create a new entry
      parameters: []
      responses:
        '201':
          description: Successful entry creation
          content:
            application/json:
              example:
                id: 4
                name: cost
                label: Cost
                weight: 3
                status: 1
                created_at: '2021-04-28T11:34:01.000000Z'
                updated_at: '2021-04-28T11:34:01.000000Z'
                deleted_at: null
                services_count: 15
                api: https://example.org/api/finder/fields/4
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: Field name
                  type: string
                  default: null
                label:
                  description: Field label
                  type: string
                  default: null
                weight:
                  description: Field weight
                  type: integer
                  default: null
                status:
                  description: Published state of the record
                  type: integer
                  default: 1
              required:
              - name
              - label
      tags:
      - Finder
      summary: Create finder fields
      x-summary-source: derived
      operationId: postFinderFields
      x-operation-id-source: derived
  /finder/fields/{id}:
    get:
      description: Retrieve an entry
      parameters:
      - in: path
        name: id
