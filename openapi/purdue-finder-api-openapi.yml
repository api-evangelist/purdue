openapi: 3.2.0
info:
  title: RCAC Finder API
  version: 0.0.1
servers:
- url: https://www.rcac.purdue.edu/api
  description: Production server
tags:
- name: Finder
paths:
  /finder/facets:
    get:
      description: Display a listing of entries
      parameters:
      - in: query
        name: parentid
        description: Parent department ID
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: limit
        description: Number of result per page.
        type: integer
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: order
        description: Field to sort results by.
        type: string
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - motd
          - datetimecreated
          - datetimeremoved
      - in: query
        name: order_dir
        description: Direction to sort results by.
        type: string
        required: false
        default: desc
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Finder
      summary: Get finder facets
      x-summary-source: derived
      operationId: getFinderFacets
      x-operation-id-source: derived
    post:
      description: Create a new entry
      parameters: []
      responses:
        '201':
          description: Successful entry creation
          content:
            application/json:
              example:
                id: 1
                name: Is your dataset restricted to U.S. persons only?
                control_type: radio
                parent: 0
                weight: 1
                status: 1
                description: '<p>Export controlled data (ITAR/EAR) are restricted by law to U.S. persons only. This means that non-U.S. persons including international students or individuals from foreign countries are barred from accessing this data.</p>


                  <p>Contact <a href="https://yourinstitution/research/regulatory-affairs/";>Regulatory Affairs</a> for more information.</p>

                  '
                created_at: '2021-04-28T12:27:39.000000Z'
                updated_at: '2021-04-28T12:27:39.000000Z'
                deleted_at: null
                api: https://example.org/api/finder/facets/11
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: Facet name
                  type: string
                  default: null
                parentid:
                  description: Parent department ID
                  type: integer
                  default: null
              required:
              - name
      tags:
      - Finder
      summary: Create finder facets
      x-summary-source: derived
      operationId: postFinderFacets
      x-operation-id-source: derived
  /finder/facets/{id}:
    get:
      description: Retrieve an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
          content:
            application/json:
              example:
                id: 1
                name: Is your dataset restricted to U.S. persons only?
                control_type: radio
                parent: 0
                weight: 1
                status: 1
                description: '<p>Export controlled data (ITAR/EAR) are restricted by law to U.S. persons only. This means that non-U.S. persons including international students or individuals from foreign countries are barred from accessing this data.</p>


                  <p>Contact <a href="https://yourinstitution/research/regulatory-affairs/";>Regulatory Affairs</a> for more information.</p>

                  '
                created_at: '2021-04-28T12:27:39.000000Z'
                updated_at: '2021-04-28T12:27:39.000000Z'
                deleted_at: null
                api: https://example.org/api/finder/facets/11
        '404':
          description: Record not found
      tags:
      - Finder
      summary: Get finder facets by id
      x-summary-source: derived
      operationId: getFinderFacetsById
      x-operation-id-source: derived
    put:
      description: Update an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Successful entry modification
          content:
            application/json:
              example:
                id: 1
                name: Is your dataset restricted to U.S. persons only?
                control_type: radio
                parent: 0
                weight: 1
                status: 1
                description: '<p>Export controlled data (ITAR/EAR) are restricted by law to U.S. persons only. This means that non-U.S. persons including international students or individuals from foreign countries are barred from accessing this data.</p>


                  <p>Contact <a href="https://yourinstitution/research/regulatory-affairs/";>Regulatory Affairs</a> for more information.</p>

                  '
                created_at: '2021-04-28T12:27:39.000000Z'
                updated_at: '2021-04-28T12:27:39.000000Z'
                deleted_at: null
                api: https://example.org/api/finder/facets/11
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: Facet name
                  type: string
                  default: null
                parentid:
                  description: Parent department ID
                  type: integer
                  default: null
              required: []
      tags:
      - Finder
      summary: Replace finder facets by id
      x-summary-source: derived
      operationId: putFinderFacetsById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - Finder
      summary: Delete finder facets by id
      x-summary-source: derived
      operationId: deleteFinderFacetsById
      x-operation-id-source: derived
  /finder/fields:
    get:
      description: Display a listing of entries
      parameters:
      - in: query
        name: status
        description: Published status
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: limit
        description: Number of result per page.
        type: integer
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: order
        description: Field to sort results by.
        type: string
        required: false
