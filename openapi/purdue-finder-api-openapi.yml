      summary: Replace finder fields by id
      x-summary-source: derived
      operationId: putFinderFieldsById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - Finder
      summary: Delete finder fields by id
      x-summary-source: derived
      operationId: deleteFinderFieldsById
      x-operation-id-source: derived
  /finder/settings:
    get:
      description: Get settings
      parameters: []
      responses:
        '200':
          description: Successful entry modification
          content:
            application/json:
              example:
                name: Finder
                title: Data Storage Solutions Finder
                subtitle: This tool will offer recommendations of solutions appropriate to your usage needs and the data security constraints.
                question_header: Answer these questions to help identify storage solutions and services that are most suitable for your needs.
                service_header: Select data storage solutions you would like to compare in details.
                chart_header: Select data storage solutions you would like to compare.
                email_form_header: This is the email email_form
                email_address: help@example.org
                email_name: Example Org
                main_header: Main Header
                button_select_all: Select All
                button_clear_selections: Clear Selections
      tags:
      - Finder
      summary: Get finder settings
      x-summary-source: derived
      operationId: getFinderSettings
      x-operation-id-source: derived
  /finder/servicelist:
    get:
      description: Get service list
      parameters: []
      responses:
        '200':
          description: Successful entry modification
          content:
            application/json:
              example:
              - id: 14
                title: Amazon Drive
                summary: A personal cloud storage platform hosted by Amazon.
                facet_matches:
                - 4
                - 7
                - 10
                - 13
                - 15
                field_data:
                  field_also_known_as:
                    value: '<p><span>Amazon Clouddrive, Amazon Photos</span></p>

                      '
                    label: Also Known As
                    weight: 12
                  field_capacity_details:
                    value: '<p><span>Free basic tier (5 GB), several paid plans</span>.</p>

                      '
                    label: Capacity Details
                    weight: 1
                  field_cost:
                    value: '<p><span>Free (5 GB), paid.</span></p>

                      '
                    label: Cost
                    weight: 3
              - id: 8
                title: Box Research Lab Folder
                summary: Box Research Lab Folder
                facet_matches:
                - 3
                - 4
                - 7
                - 10
                - 13
                - 15
                - 16
                field_data:
                  field_also_known_as:
                    value: '<p>Box, Box.com</p>

                      '
                    label: Also Known As
                    weight: 12
                  field_capacity_details:
                    value: '<p>Box provides unlimited storage space, however individual files may not exceed 15 GB.</p>

                      '
                    label: Capacity Details
                    weight: 1
                  field_cost:
                    value: '<p>Free</p>

                      '
                    label: Cost
                    weight: 3
      tags:
      - Finder
      summary: Get finder servicelist
      x-summary-source: derived
      operationId: getFinderServicelist
      x-operation-id-source: derived
  /finder/facettree:
    get:
      description: Get facet tree
      parameters: []
      responses:
        '200':
          description: Successful entry modification
          content:
            application/json:
              example:
              - id: 11
                name: Is your dataset restricted to U.S. persons only?
                control_type: radio
                parent: 0
                weight: 1
                selected: false
                description: '<p>Export controlled data (ITAR/EAR) are restricted by law to U.S. persons only. This means that non-U.S. persons including international students or individuals from foreign countries are barred from accessing this data.</p>


                  <p>Contact <a href="https://yourinstitution/research/regulatory-affairs/";>Regulatory Affairs</a> for more information.</p>

                  '
                choices:
                - id: 12
                  name: 'Yes'
                  control_type: null
                  parent: 11
                  weight: 0
                  description: null
                - id: 13
                  name: 'No'
                  control_type: null
                  parent: 11
                  weight: 1
                  description: null
              - id: 8
                name: Will your project utilize a community cluster?
                control_type: radio
                parent: 0
                weight: 2
                selected: false
                description: '<p><a href="https://yourinstitution/services/communityclusters/";>Community clusters</a> provide cost effective computing resources for researchers to run tasks requiring large amounts of computing resources.</p>


                  <p>For more information on community clusters, <a href="mailto:yourinstitution">contact Your Institution</a>.</p>

                  '
                choices:
                - id: 9
                  name: 'Yes'
                  control_type: null
                  parent: 8
                  weight: 0
                  description: null
                - id: 10
                  name: 'No'
                  control_type: null
                  parent: 8
                  weight: 1
                  description: null
      tags:
      - Finder
      summary: Get finder facettree
      x-summary-source: derived
      operationId: getFinderFacettree
      x-operation-id-source: derived
  /finder/sendmail:
    post:
      description: Send an email
      parameters: []
      responses:
        '200':
          description: Successful entry creation
          content:
            application/json:
              example: Your message has been sent.
      tags:
      - Finder
      summary: Create finder sendmail
      x-summary-source: derived
      operationId: postFinderSendmail
      x-operation-id-source: derived
  /finder/services:
