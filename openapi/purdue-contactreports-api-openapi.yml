        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - datetimecreated
          - datetimeremoved
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      tags:
      - Contactreports
      summary: Get contactreports comments
      x-summary-source: derived
      operationId: getContactreportsComments
      x-operation-id-source: derived
    post:
      description: Create a contact report comment
      parameters: []
      responses:
        '201':
          description: Successful entry creation
          content:
            application/json:
              example:
                id: 1
                contactreportid: 1
                userid: 1234
                comment: Example comment
                stemmedcomment: example comment
                notice: 0
                datetimecreated: '2021-09-14 13:01:55'
                formatteddate: Sep 14, 2021&nbsp; 1:01pm
                formattedcomment: <p>Example comment</p>
                username: John Doe
                api: https://example.org/api/contactreports/comments/1
        '401':
          description: Unauthorized
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                comment:
                  description: The comment being made
                  type: string
                  default: null
                contactreportid:
                  description: ID of the contact report
                  type: integer
                  default: null
                userid:
                  description: User ID
                  type: integer
                  default: 0
                notice:
                  description: Notification state
                  type: integer
                  default: 0
              required:
              - comment
