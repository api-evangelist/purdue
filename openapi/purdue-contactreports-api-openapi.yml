  /contactreports:
    get:
      description: Display a listing of contact reports
      parameters:
      - in: query
        name: limit
        description: Number of result per page.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: type
        description: Contact Report type ID
        required: false
        schema:
          type: integer
      - in: query
        name: group
        description: Filter by group ID
        required: false
        schema:
          type: integer
      - in: query
        name: start
        description: Timestamp (YYYY-MM-DD or YYYY-MM-DD hh:mm:ss) for records on or after that date
        required: false
        schema:
          type: string
          format: date
          example: '2021-01-30'
      - in: query
        name: stop
        description: Timestamp (YYYY-MM-DD or YYYY-MM-DD hh:mm:ss) for records before that date
        required: false
        schema:
          type: string
          format: date
          example: '2021-01-30'
      - in: query
        name: people
        description: Filter by people associated with reports. Comma-separated list of usernames, emails, or user IDs
        required: false
        schema:
          type: string
          example: person1,person2,person3
      - in: query
        name: resource
        description: Filter by resources associated with reports. Comma-separated list of resource IDs
        required: false
        schema:
          type: string
          example: 1,2,3
      - in: query
        name: tag
        description: Filter by tags associated with reports. Comma-separated list of tags
        required: false
        schema:
          type: string
          example: tag1,tag2,tag3
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: notice
        description: Filter by notice value
        required: false
        schema:
          type: integer
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - report
          - datetimecreated
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      tags:
      - Contactreports
      summary: Get contactreports
      x-summary-source: derived
      operationId: getContactreports
      x-operation-id-source: derived
