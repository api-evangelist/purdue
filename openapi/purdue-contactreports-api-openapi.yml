    get:
      description: Display a listing of contact reports comments
      parameters:
      - in: query
        name: contactreportid
        description: ID of contact report
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
