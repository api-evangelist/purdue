  /courses/members/import:
    post:
      description: Import
      parameters: []
      responses:
        '201':
          description: Successful entry creation
          content:
            application/json:
              example:
                data:
                - id: 1
                  classaccountid: 1
                  userid: 1234
                  membertype: 1
                  datetimestart: '2016-08-22T04:00:00.000000Z'
                  datetimestop: '2016-12-17T05:00:00.000000Z'
                  notice: 0
                  datetimecreated: '2016-08-19T04:02:01.000000Z'
                  datetimeremoved: null
                  api: https://example.org/api/courses/members/1
                  user:
                    id: 1234
                    name: Jane Doe
                    username: jdoe
                - id: 2
                  classaccountid: 1
                  userid: 1235
                  membertype: 1
                  datetimestart: '2016-08-22T04:00:00.000000Z'
                  datetimestop: '2016-12-17T05:00:00.000000Z'
                  notice: 0
                  datetimecreated: '2016-08-19T04:02:01.000000Z'
                  datetimeremoved: null
                  api: https://example.org/api/courses/members/2
                  user:
                    id: 1235
                    name: Jimmy Doe
                    username: jimmyd
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                id:
                  description: Class account ID
                  type: integer
                  default: null
                file:
                  description: File to be uploaded
                  type: array
                  default: null
              required:
              - id
              - file
      tags:
      - Courses
      summary: Create courses members import
      x-summary-source: derived
      operationId: postCoursesMembersImport
      x-operation-id-source: derived
components:
  securitySchemes:
    api_token:
      type: apiKey
      name: api_token
      in: header
