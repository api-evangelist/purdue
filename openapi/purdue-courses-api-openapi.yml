                api: https://example.org/api/courses/members/1
                user:
                  id: 1234
                  name: Jane Doe
                  username: jdoe
        '404':
          description: Record not found
      tags:
      - Courses
      summary: Get courses members by id
      x-summary-source: derived
      operationId: getCoursesMembersById
      x-operation-id-source: derived
    put:
      description: Update an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry modification
          content:
            application/json:
              example:
                id: 1
                classaccountid: 1
                userid: 1234
                membertype: 1
                datetimestart: '2016-08-22T04:00:00.000000Z'
                datetimestop: '2016-12-17T05:00:00.000000Z'
                notice: 0
                datetimecreated: '2016-08-19T04:02:01.000000Z'
                datetimeremoved: null
                api: https://example.org/api/courses/members/1
                user:
                  id: 1234
                  name: Jane Doe
                  username: jdoe
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                classaccountid:
                  description: Class account ID
                  type: integer
                  default: 0
                membertype:
                  description: Member type ID
                  type: integer
                  default: 0
                userid:
                  description: User ID
                  type: integer
                  default: 0
                datetimestart:
                  description: Datetime (YYYY-MM-DD hh:mm:ss) user enrollment starts
                  type: string
                  default: null
                datetimestop:
                  description: Datetime (YYYY-MM-DD hh:mm:ss) user enrollment stops
                  type: string
                  default: null
                notice:
                  description: Notice state
                  type: integer
                  default: null
              required: []
      tags:
      - Courses
      summary: Replace courses members by id
      x-summary-source: derived
      operationId: putCoursesMembersById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
