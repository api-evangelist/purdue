        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - motd
          - datetimecreated
          - datetimeremoved
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Successful entries lookup
          content:
            application/json:
              example:
                data:
                - id: '1'
                  name: Examples
                  tagresources: 0
                  tagusers: 1
                  location: 1
                  future: 1
                  calendar: 1
                  url: 1
                  api: https://example.com/api/news/types/1
                - id: '2'
                  name: Outages and Maintenance
                  tagresources: 1
                  tagusers: 0
                  location: 0
                  future: 1
                  calendar: 1
                  url: 0
                  api: https://example.com/api/news/types/2
                links:
                  first: https://example.com/api/news/types?limit=20&order=name&order_dir=asc&page=1
                  last: https://example.com/api/news/types?limit=20&order=name&order_dir=asc&page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: https://example.com/api/news/types
                  per_page: 20
                  to: 2
                  total: 2
        '415':
          description: Invalid data
      tags:
      - News
      summary: Get news associations
      x-summary-source: derived
      operationId: getNewsAssociations
      x-operation-id-source: derived
    post:
      description: Create a news associations
      parameters: []
      responses:
        '200':
          description: Successful entry creation
          content:
            application/json:
              example:
                id: 1
                associd: 1234
                assoctype: user
                newsid: 1
                comment: Examples
                api: https://example.com/api/news/associations/1
        '415':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                associd:
                  description: The association ID
                  type: integer
                  default: null
                assoctype:
                  description: The association type
                  type: string
                  default: null
                newsid:
                  description: The news article ID
                  type: integer
                  default: null
                comment:
                  description: Comment / notes
                  type: string
                  default: null
              required:
