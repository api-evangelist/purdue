openapi: 3.2.0
info:
  title: RCAC News API
  version: 0.0.1
servers:
- url: https://www.rcac.purdue.edu/api
  description: Production server
tags:
- name: News
paths:
  /news:
    get:
      description: Display a listing of news articles
      parameters:
      - in: query
        name: start
        description: Filter entries scheduled on or after this date
        required: false
        schema:
          type: string
          format: date-time
          example: '2021-01-30T08:30:00Z'
      - in: query
        name: stop
        description: Filter entries scheduled to end before this date
        required: false
        schema:
          type: string
          format: date-time
          example: '2021-01-30T08:30:00Z'
      - in: query
        name: type
        description: New type ID
        required: false
        schema:
          type: integer
          default: 'null'
      - in: query
        name: state
        description: The article state.
        required: false
        schema:
          type: string
          default: published
          enum:
          - published
          - unpublished
      - in: query
        name: resource
        description: A comma-separated list of associated resource IDs to filter by
        required: false
        schema:
          type: string
          example: 1,2,3,4
      - in: query
        name: location
        description: A location to filter entries by.
        required: false
        schema:
          type: string
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of result per page.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - headline
          - datetimecreated
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      tags:
      - News
      summary: Get news
      x-summary-source: derived
      operationId: getNews
      x-operation-id-source: derived
    post:
      description: Create a news article
      parameters: []
      responses:
        '201':
          description: Successful entry creation
        '401':
          description: Unauthorized
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                headline:
                  description: The entry's headline
                  type: string
                  default: null
                body:
                  description: The entry's body
                  type: string
                  default: null
                newstypeid:
                  description: ID of the news type
                  type: integer
                  default: null
                published:
                  description: Published state
                  type: integer
                  default: 1
                template:
                  description: If entry is a template or not
                  type: integer
                  default: 0
                datetimenews:
                  description: Start date and time
                  type: string
                  default: null
                datetimenewsend:
                  description: Stop date and time
                  type: string
                  default: null
                location:
                  description: Entry location
                  type: string
                  default: null
                url:
                  description: URL for the entry
                  type: string
                  default: null
              required:
              - headline
              - body
              - newstypeid
              - datetimenews
      tags:
      - News
      summary: Create news
      x-summary-source: derived
      operationId: postNews
      x-operation-id-source: derived
  /news/{id}:
    get:
      description: Read a news article
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
        '404':
          description: Record not found
      tags:
      - News
      summary: Get news by id
      x-summary-source: derived
      operationId: getNewsById
      x-operation-id-source: derived
    put:
      description: Update a news article
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Successful entry modification
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                headline:
                  description: The entry's headline
                  type: string
                  default: null
                body:
                  description: The entry's body
                  type: string
                  default: null
                newstypeid:
                  description: ID of the news type
                  type: integer
                  default: null
                published:
                  description: Published state
                  type: integer
                  default: 1
                template:
                  description: If entry is a template or not
                  type: integer
                  default: 0
                datetimenews:
                  description: Start date and time
                  type: string
                  default: null
                datetimenewsend:
                  description: Stop date and time
                  type: string
                  default: null
                location:
                  description: Entry location
                  type: string
                  default: null
                url:
                  description: URL for the entry
                  type: string
                  default: null
              required: []
      tags:
      - News
      summary: Replace news by id
      x-summary-source: derived
      operationId: putNewsById
      x-operation-id-source: derived
    delete:
      description: Delete a news article
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - News
      summary: Delete news by id
      x-summary-source: derived
      operationId: deleteNewsById
      x-operation-id-source: derived
  /news/{id}/views:
    get:
      description: Retrieve news article view stats
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
      tags:
      - News
      summary: Get news by id views
      x-summary-source: derived
      operationId: getNewsByIdViews
      x-operation-id-source: derived
  /news/preview:
    post:
      description: Preview a news article
      parameters: []
      responses:
        '201':
          description: Successful entry preparation
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                body:
                  description: The entry's body
                  type: string
                  default: null
                vars:
                  description: A list of key/value pairs for variable replacement in the body text
                  type: array
                  default: null
              required:
              - body
      tags:
      - News
      summary: Create news preview
      x-summary-source: derived
      operationId: postNewsPreview
      x-operation-id-source: derived
  /news/{id}/email:
    post:
      description: Email a news article
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Successful email
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                headline:
                  description: Optional alternate article headline
                  type: string
                  default: null
                body:
                  description: Optional alternate article body
                  type: string
                  default: null
                resources:
                  description: A list of resource IDs to send the email to mailing lists.
                  type: array
                  default: null
                associations:
                  description: A list of user IDs to send the email to. If none provided, Resource mailing lists are used instead.
                  type: array
                  default: null
              required: []
      tags:
      - News
      summary: Create news by id email
      x-summary-source: derived
      operationId: postNewsByIdEmail
      x-operation-id-source: derived
  /news/associations:
    get:
      description: Display a listing of news article types
      parameters:
      - in: query
        name: tagresources
        description: Filter by types that allow articles to tag resources
        required: false
        schema:
          type: integer
      - in: query
        name: location
        description: Filter by types that allow articles to set location
        required: false
        schema:
          type: integer
      - in: query
        name: future
