openapi: 3.2.0
info:
  title: RCAC Users API
  version: 0.0.1
servers:
- url: https://www.rcac.purdue.edu/api
  description: Production server
tags:
- name: Users
paths:
  /users/facets:
    get:
      description: Display a listing of entries
      parameters:
      - in: query
        name: user_id
        description: User to retrieve facets for.
        required: true
        schema:
          type: integer
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of result per page.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - datetimecreated
          - datetimeremoved
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      tags:
      - Users
      summary: Get users facets
      x-summary-source: derived
      operationId: getUsersFacets
      x-operation-id-source: derived
    post:
      description: Create a new entry
      parameters: []
      responses:
        '201':
          description: Successful entry creation
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                key:
                  description: Facet name
                  type: string
                  default: null
                value:
                  description: Facet value
                  type: string
                  default: null
                user_id:
                  description: User ID
                  type: integer
                  default: 0
                access:
                  description: View level ID
                  type: integer
                  default: 0
                locked:
                  description: Is the value editable?
                  type: boolean
                  default: 0
              required:
              - key
              - value
              - user_id
      tags:
      - Users
      summary: Create users facets
      x-summary-source: derived
      operationId: postUsersFacets
      x-operation-id-source: derived
  /users/facets/{id}:
    get:
      description: Retrieve an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
        '404':
          description: Record not found
      tags:
      - Users
      summary: Get users facets by id
      x-summary-source: derived
      operationId: getUsersFacetsById
      x-operation-id-source: derived
    put:
      description: Update an entry
      parameters: []
      responses:
        '204':
          description: Successful entry modification
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                value:
                  description: Facet value
                  type: string
                  default: null
                access:
                  description: View level ID
                  type: integer
                  default: null
              required:
              - value
      tags:
      - Users
      summary: Replace users facets by id
      x-summary-source: derived
      operationId: putUsersFacetsById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful deletion
        '404':
          description: Record not found
      tags:
      - Users
      summary: Delete users facets by id
      x-summary-source: derived
      operationId: deleteUsersFacetsById
      x-operation-id-source: derived
  /users/levels:
    get:
      description: Display a listing of entries
      parameters:
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of result per page.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - datetimecreated
          - datetimeremoved
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Successful creation
          content:
            application/json:
              example:
                data:
                - id: 1
                  title: Public
                  ordering: 0
                  rules:
                  - 1
                  api: https://yourhost/api/users/levels/1
                - id: 2
                  title: Registered
                  ordering: 1
                  rules:
                  - 2
                  - 8
                  api: https://yourhost/api/users/levels/2
      tags:
      - Users
      summary: Get users levels
      x-summary-source: derived
      operationId: getUsersLevels
      x-operation-id-source: derived
    post:
      description: Create a new entry
      parameters: []
      responses:
        '200':
          description: Successful creation
          content:
            application/json:
              example:
                id: 7
                title: Example
                ordering: 7
                rules:
                - 2
                - 3
                - 4
                api: https://yourhost/api/users/levels/7
        '404':
          description: Record not found
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                title:
                  description: Access level title
                  type: string
                  default: null
                rules:
                  description: A list of role IDs
                  type: array
                  default: null
              required:
              - title
              - rules
      tags:
      - Users
      summary: Create users levels
      x-summary-source: derived
      operationId: postUsersLevels
      x-operation-id-source: derived
  /users/levels/{id}:
    get:
      description: Retrieve an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              example:
                id: 7
                title: Example
                ordering: 7
                rules:
                - 2
                - 3
                - 4
                api: https://yourhost/api/users/levels/7
        '404':
          description: Record not found
      tags:
      - Users
      summary: Get users levels by id
      x-summary-source: derived
      operationId: getUsersLevelsById
      x-operation-id-source: derived
    put:
      description: Update an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              example:
                id: 7
                title: Example
                ordering: 7
                rules:
                - 2
                - 3
                - 4
                - 5
                api: https://yourhost/api/users/levels/7
        '404':
          description: Record not found
        '415':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                title:
                  description: Access level title
                  type: string
                  default: null
                rules:
                  description: A list of role IDs
                  type: array
                  default: null
              required: []
      tags:
      - Users
      summary: Replace users levels by id
      x-summary-source: derived
      operationId: putUsersLevelsById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful deletion
        '404':
          description: Record not found
      tags:
      - Users
      summary: Delete users levels by id
      x-summary-source: derived
      operationId: deleteUsersLevelsById
      x-operation-id-source: derived
