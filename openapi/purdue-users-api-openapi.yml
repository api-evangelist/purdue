        required: false
        schema:
          type: integer
      - in: query
        name: unread
        description: Find notifications amrked as unread
        required: false
        schema:
          type: integer
      - in: query
        name: read
        description: Find notifications amrked as read
        required: false
        schema:
          type: integer
      - in: query
        name: search
