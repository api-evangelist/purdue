  /users/{id}:
    get:
      description: Retrieve an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      - in: query
        name: module_permissions
        description: A comma-separated list of modules to grab permissions from
        required: false
        schema:
          type: string
          example: news,users,resources
      responses:
        '200':
          description: Successful entry read
        '404':
          description: Record not found
      tags:
      - Users
      summary: Get users by id
      x-summary-source: derived
      operationId: getUsersById
      x-operation-id-source: derived
    put:
      description: Update an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Successful entry modification
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: User name
                  type: string
                  default: null
                api_token:
                  description: API token
                  type: string
                  default: null
                puid:
                  description: Organization ID
                  type: integer
                  default: null
                username:
                  description: Username
                  type: string
                  default: null
                unixid:
                  description: Unix user ID
                  type: integer
                  default: null
                datelastseen:
                  description: Last time the user logged in
                  type: string
                  default: null
                roles:
                  description: A list of Role IDs to apply to the user
                  type: array
                  default: null
              required: []
      tags:
      - Users
      summary: Replace users by id
      x-summary-source: derived
      operationId: putUsersById
      x-operation-id-source: derived
    delete:
      description: Delete an entry
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - Users
      summary: Delete users by id
      x-summary-source: derived
      operationId: deleteUsersById
      x-operation-id-source: derived
components:
  securitySchemes:
    api_token:
      type: apiKey
      name: api_token
      in: header
