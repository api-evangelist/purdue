                schedulerid:
                  description: Scheduler ID
                  type: integer
                  default: null
                subresourceid:
                  description: Subresource ID
                  type: integer
                  default: null
                name:
                  description: The name of the queue
                  type: string
                  default: null
                groupid:
                  description: Group ID
                  type: integer
                  default: null
                queuetype:
                  description: Queue type
                  type: integer
                  default: null
                automatic:
                  description: Automatic
                  type: integer
                  default: null
                free:
                  description: Free
                  type: integer
                  default: null
                schedulerpolicyid:
                  description: Scheduler Policy ID
                  type: integer
                  default: null
                enabled:
                  description: Enabled
                  type: integer
                  default: null
                started:
                  description: Started
                  type: integer
                  default: null
                reservation:
                  description: Reservation
                  type: integer
                  default: null
                cluster:
                  description: Cluster
                  type: string
                  default: null
                priority:
                  description: Priority
                  type: integer
