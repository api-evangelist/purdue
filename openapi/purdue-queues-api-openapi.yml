openapi: 3.2.0
info:
  title: RCAC Queues API
  version: 0.0.1
servers:
- url: https://www.rcac.purdue.edu/api
  description: Production server
tags:
- name: Queues
paths:
  /queues/loans:
    get:
      description: Display a listing of loans for a queue
      parameters:
      - in: query
        name: queueid
        description: ID of the queue the loan whent to
        required: false
        schema:
          type: integer
      - in: query
        name: lenderqueueid
        description: ID of the lender queue
        required: false
        schema:
          type: integer
      - in: query
        name: state
        description: Sate of the loan.
        required: false
        schema:
          type: string
          enum:
          - ended
          - ongoing
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of result to return.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimestart
          enum:
          - id
          - queueid
          - lenderqueueid
          - datetimestart
          - datetimestop
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Queues
      summary: Get queues loans
      x-summary-source: derived
      operationId: getQueuesLoans
      x-operation-id-source: derived
    post:
      description: Create a queue loan
      parameters: []
      responses:
        '201':
          description: Successful entry creation
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                queueid:
                  description: ID of the queue being loaned to
                  type: integer
                  default: null
                lenderqueueid:
                  description: ID of the queue being loaned
                  type: integer
                  default: null
                datetimestart:
                  description: Date/time of when the loan starts
                  type: string
                  default: null
                datetimestop:
                  description: Date/time of when the loan stops
                  type: string
                  default: null
                nodecount:
                  description: Node count
                  type: integer
                  default: null
                corecount:
                  description: Core count
                  type: integer
                  default: null
                serviceunits:
                  description: Service units
                  type: float
                  default: null
                comment:
                  description: Comments on this loan
                  type: string
                  default: null
              required:
              - queueid
              - lenderqueueid
              - datetimestart
              - nodecount
              - corecount
      tags:
      - Queues
      summary: Create queues loans
      x-summary-source: derived
      operationId: postQueuesLoans
      x-operation-id-source: derived
  /queues/loans/{id}:
    get:
      description: Read a queue loan
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
        '404':
          description: Record not found
      tags:
      - Queues
      summary: Get queues loans by id
      x-summary-source: derived
      operationId: getQueuesLoansById
      x-operation-id-source: derived
    put:
      description: Update a queue loan
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry modification
        '404':
          description: Record not found
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                datetimestart:
                  description: Date/time of when the loan starts
                  type: string
                  default: null
                datetimestop:
                  description: Date/time of when the loan stops
                  type: string
                  default: null
                nodecount:
                  description: Node count
                  type: integer
                  default: null
                corecount:
                  description: Core count
                  type: integer
                  default: null
                serviceunits:
                  description: Service units
                  type: float
                  default: null
                comment:
                  description: Comments on this loan
                  type: string
                  default: null
              required: []
      tags:
      - Queues
      summary: Replace queues loans by id
      x-summary-source: derived
      operationId: putQueuesLoansById
      x-operation-id-source: derived
    delete:
      description: Delete a queue loan
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - Queues
      summary: Delete queues loans by id
      x-summary-source: derived
      operationId: deleteQueuesLoansById
      x-operation-id-source: derived
  /queues/qos:
    get:
      description: Display a listing of QoS
      parameters:
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: hostname
        description: A scheduler hostname
        required: false
        schema:
          type: string
      - in: query
        name: priority
        description: Filter by priority level.
        required: false
        schema:
          type: integer
      - in: query
        name: scheduler_id
        description: Filter by scheduler ID. If unknown, can use hostname.
        required: false
        schema:
          type: integer
      - in: query
        name: format
        description: Output format. JSON is the default but output can be formatted to accommodate schedulers such as SLURM.
        required: false
        schema:
          type: string
          enum:
          - json
          - slurmcfg
      - in: query
        name: limit
        description: Number of result to return.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: name
          enum:
          - id
          - name
          - schedulerid
          - datetimestart
          - datetimestop
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Queues
      summary: Get queues qos
      x-summary-source: derived
      operationId: getQueuesQos
      x-operation-id-source: derived
    post:
      description: Create a QoS
      parameters: []
      responses:
        '201':
          description: Successful entry creation
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                scheduler_id:
                  description: Associate the QoS to a specific scheduler
                  type: integer
                  default: null
                name:
                  description: Entry name
                  type: string
                  default: null
                description:
                  description: Entry description
                  type: string
                  default: null
                flags:
                  description: Comma-separated list of flags
                  type: string
                  default: null
                max_jobs_pa:
                  description: Max jobs per account
                  type: integer
                  default: null
                max_jobs_per_user:
                  description: Max jobs per user
                  type: integer
                  default: null
                max_jobs_accrue_pa:
                  description: Max jobs accrueable per account
                  type: integer
                  default: null
                max_jobs_accrue_pu:
                  description: Max jobs accrueable per user
                  type: integer
                  default: null
                max_submit_jobs_pa:
                  description: Max jobs submittable per account
                  type: integer
                  default: null
                max_submit_jobs_per_user:
                  description: Max jobs submittable per user
                  type: integer
                  default: null
                max_tres_pj:
                  description: Max TRES per job
                  type: string
                  default: null
                max_tres_pn:
                  description: Max TRES per node
                  type: string
                  default: null
                max_tres_pu:
                  description: Max TRES per user
                  type: string
                  default: null
                max_tres_pa:
                  description: Max TRES per account
                  type: string
                  default: null
                max_tres_mins_pj:
                  description: Max TRES minutes per job
                  type: integer
                  default: null
                max_tres_run_mins_pa:
                  description: Max TRES run minutes per account
                  type: integer
                  default: null
                max_tres_run_mins_pu:
                  description: Max TRES run minutes per user
                  type: integer
                  default: null
                min_tres_pj:
                  description: Minimum TRES per job
                  type: string
                  default: null
                max_wall_duration_per_job:
                  description: Max wall duration per job
                  type: integer
                  default: null
                grp_jobs:
                  description: Group jobs
                  type: integer
                  default: null
                grp_jobs_accrue:
                  description: Accrueable Group jobs
                  type: integer
                  default: null
                grp_submit_jobs:
                  description: Group submit jobs
                  type: integer
                  default: null
                grp_tres:
                  description: Group TRES
                  type: string
                  default: null
                grp_tres_mins:
                  description: Group TRES minutes
                  type: integer
                  default: null
                grp_tres_run_mins:
                  description: Group TRES run minutes
                  type: integer
                  default: null
                grp_wall:
                  description: Group walltime in minutes
                  type: integer
                  default: null
                preempt:
                  description: Preempt
                  type: string
                  default: null
                preempt_mode:
                  description: Preempt mode
                  type: integer
                  default: null
                preempt_exempt_time:
                  description: Preempt exempt time (in minutes)
                  type: integer
                  default: null
                priority:
                  description: The act of 'stopping' one or more 'low-priority' jobs to let a 'high-priority' job run.
                  type: integer
                  default: null
                usage_factor:
                  description: Usage factor
                  type: string
                  default: null
                usage_thres:
                  description: Usage threshold
                  type: string
                  default: null
                limit_factor:
                  description: Limit factor
                  type: string
                  default: null
                grace_time:
                  description: Grace time in minutes
                  type: integer
                  default: null
              required:
              - scheduler_id
              - name
      tags:
      - Queues
      summary: Create queues qos
      x-summary-source: derived
      operationId: postQueuesQos
      x-operation-id-source: derived
