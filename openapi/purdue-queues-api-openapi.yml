  /queues:
    get:
      description: Display a listing of the queue.
      parameters:
      - in: query
        name: expand
        description: Comma-separated list of associated objects, such as group and resource, to include. Members, purchases, and loans are always included.
        required: false
        schema:
          type: string
          default: subresource
          enum:
          - all
          - group
          - resource
          - subresource
          - schedulerpolicy
          - scheduler
      - in: query
        name: state
        description: Queue state.
        required: false
        schema:
          type: string
          default: enabled
          enum:
          - enabled
          - active
          - disabled
          - trashed
      - in: query
        name: type
        description: Queue type ID.
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: scheduler
        description: Scheduler type ID.
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: resource
        description: Resource ID.
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: subresource
        description: Subresource ID.
        required: false
        schema:
          type: integer
          default: 0
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: limit
        description: Number of result to return.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: datetimecreated
          enum:
          - id
          - name
          - datetimecreated
          - datetimeremoved
          - queuetype
          - schedulerid
          - subresourceid
          - schedulerpolicyid
          - cluster
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      tags:
      - Queues
      summary: Get queues
      x-summary-source: derived
      operationId: getQueues
      x-operation-id-source: derived
    post:
      description: Create a queue
      parameters: []
      responses:
