                  type: integer
                  default: null
                nodecoresmin:
                  description: Nodes core min
                  type: integer
                  default: null
                nodecoresmax:
                  description: Nodes core max
                  type: integer
                  default: null
                nodememmin:
                  description: Node memory max
                  type: string
                  default: null
                aclusersenabled:
                  description: ACL Users enabled
                  type: integer
                  default: null
                aclgroups:
                  description: Comma-separated list of ACL Groups
                  type: string
                  default: null
                maxijobfactor:
                  description: Max ijob factor
                  type: integer
                  default: null
                maxijobuserfactor:
                  description: Max ijob user factor
                  type: integer
                  default: null
                shared:
                  description: Shared qeue
                  type: integer
                  default: 0
              required:
