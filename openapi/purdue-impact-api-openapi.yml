        schema:
          type: string
      - in: query
        name: order_dir
        description: Direction to sort results by.
        type: string
        required: false
        default: desc
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Impact
      summary: Get impact tables
      x-summary-source: derived
      operationId: getImpactTables
      x-operation-id-source: derived
    post:
      description: Create a new table
      parameters: []
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: Table name
                  type: string
                  default: null
                columnname:
                  description: Column name
                  type: string
                  default: null
                updatekey:
                  description: Update key
                  type: string
                  default: null
              required:
