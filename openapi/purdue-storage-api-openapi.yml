openapi: 3.2.0
info:
  title: RCAC Storage API
  version: 0.0.1
servers:
- url: https://www.rcac.purdue.edu/api
  description: Production server
tags:
- name: Storage
paths:
  /storage/directories:
    get:
      description: Display a listing of the resource.
      parameters:
      - in: query
        name: search
        description: A word or phrase to search for.
        required: false
        schema:
          type: string
      - in: query
        name: resourceid
        description: ID of the resource to filter by.
        required: false
        schema:
          type: integer
      - in: query
        name: storageresourceid
        description: ID of the storage resource to filter by.
        required: false
        schema:
          type: integer
      - in: query
        name: groupid
        description: ID of the group to filter by.
        required: false
        schema:
          type: integer
      - in: query
        name: parentstoragedirid
        description: ID of the parent directory to filter by.
        required: false
        schema:
          type: integer
      - in: query
        name: state
        description: State of entries to retrieve.
        required: false
        schema:
          type: string
          default: active
          enum:
          - '*'
          - active
          - inactive
      - in: query
        name: quota
        description: Filter by if a quota is set on the directory
        required: false
        schema:
          type: string
          default: null
          enum:
          - 'true'
          - 'false'
      - in: query
        name: limit
        description: Number of result per page.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: page
        description: Number of where to start returning results.
        required: false
        schema:
          type: integer
          default: 1
      - in: query
        name: order
        description: Field to sort results by.
        required: false
        schema:
          type: string
          default: path
          enum:
          - id
          - resourceid
          - groupid
          - parentstoragedirid
          - name
          - path
          - datetimecreated
          - datetimeremoved
          - bytes
      - in: query
        name: order_dir
        description: Direction to sort results by.
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      tags:
      - Storage
      summary: Get storage directories
      x-summary-source: derived
      operationId: getStorageDirectories
      x-operation-id-source: derived
    post:
      description: Create an entry
      parameters: []
      responses:
        '201':
          description: Successful entry creation
        '401':
          description: Unauthorized
        '409':
          description: Invalid data
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                name:
                  description: Directory name
                  type: string
                  default: null
                resourceid:
                  description: Resource id
                  type: integer
                  default: null
                groupid:
                  description: Group id
                  type: integer
                  default: null
                bytes:
                  description: Byes
                  type: string
                  default: null
                parentstorageid:
                  description: Parent directory ID
                  type: integer
                  default: 0
                owneruserid:
                  description: Owner user ID
                  type: integer
                  default: null
                unixgroupid:
                  description: Unix Group ID
                  type: integer
                  default: null
                ownerread:
                  description: Owner read permission
                  type: integer
                  default: null
                groupread:
                  description: Group read permission
                  type: integer
                  default: null
                groupwrite:
                  description: Group write permission
                  type: integer
                  default: null
                publicread:
                  description: Public read permission
                  type: integer
                  default: null
                publicwrite:
                  description: Public write permission
                  type: integer
                  default: null
                autouser:
                  description: Auto user
                  type: integer
                  default: null
                files:
                  description: Files
                  type: integer
                  default: null
                autouserunixgroupid:
                  description: Auto user Unix Group ID
                  type: integer
                  default: null
                storageresourceid:
                  description: Storage Resource ID
                  type: integer
                  default: null
              required:
              - name
              - resourceid
              - groupid
              - bytes
              - unixgroupid
      tags:
      - Storage
      summary: Create storage directories
      x-summary-source: derived
      operationId: postStorageDirectories
      x-operation-id-source: derived
  /storage/directories/{id}:
    get:
      description: Read a resource
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful entry read
        '404':
