                  type: integer
                  default: null
                ownerread:
                  description: Owner read permission
                  type: integer
                  default: null
                groupread:
                  description: Group read permission
                  type: integer
                  default: null
                groupwrite:
                  description: Group write permission
                  type: integer
                  default: null
                publicread:
                  description: Public read permission
                  type: integer
                  default: null
                publicwrite:
                  description: Public write permission
                  type: integer
                  default: null
                autouser:
                  description: Auto user
                  type: integer
                  default: null
                files:
                  description: Files
                  type: integer
                  default: null
                autouserunixgroupid:
                  description: Auto user Unix Group ID
                  type: integer
                  default: null
                storageresourceid:
                  description: Storage Resource ID
                  type: integer
                  default: null
              required: []
      tags:
      - Storage
      summary: Replace storage directories by id
      x-summary-source: derived
      operationId: putStorageDirectoriesById
      x-operation-id-source: derived
    delete:
      description: Delete a storage directory
      parameters:
      - in: path
        name: id
        description: Entry identifier
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful entry deletion
        '404':
          description: Record not found
      tags:
      - Storage
      summary: Delete storage directories by id
      x-summary-source: derived
      operationId: deleteStorageDirectoriesById
      x-operation-id-source: derived
