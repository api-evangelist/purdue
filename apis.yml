apis:
- aid: purdue:purr-oaipmh
  name: PURR OAI-PMH Metadata API
  description: >-
    The Purdue University Research Repository (PURR) exposes an OAI-PMH endpoint for harvesting research
    dataset metadata, supporting standard verbs (Identify, ListSets, ListMetadataFormats, ListIdentifiers,
    ListRecords, GetRecord) with the oai_dc (Dublin Core) metadata prefix. Confirmed live via the Identify
    verb.
  humanURL: https://purr.purdue.edu/kb/finduse/oaipmh
  baseURL: https://purr.purdue.edu/oaipmh
  tags:
  - Research
  - Repository
  - OAI-PMH
  - Metadata
  - Open Data
  properties:
  - type: Documentation
    url: https://purr.purdue.edu/kb/finduse/oaipmh
