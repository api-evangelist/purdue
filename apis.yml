- aid: purdue:purdue-epubs-oaipmh
  name: Purdue e-Pubs OAI-PMH (bepress Digital Commons tenant)
  x-operator: tenant
  description: >-
    Purdue e-Pubs is the university's institutional repository for scholarly output, reachable at docs.lib.purdue.edu
    with a working OAI-PMH 2.0 endpoint. The content, the collections and the scholarship are Purdue's;
    the platform is not. docs.lib.purdue.edu is a CNAME to dlpurdue.bepress.com and the Identify response
    names dc-support@elsevier.com as the repository administrator, so this is a bepress Digital Commons
    tenancy under a Purdue hostname. Recorded as a relationship. No bepress contract is stored under this
    institution - that contract belongs in bepress's own profile, not Purdue's.
  humanURL: https://docs.lib.purdue.edu/
  baseURL: https://docs.lib.purdue.edu/do/oai/
  tags:
