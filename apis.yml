- aid: purdue:purdue-shibboleth-idp
  name: Purdue Shibboleth Identity Provider
  x-operator: institution
  description: >-
    Purdue operates its own Shibboleth identity provider, entityID https://idp.purdue.edu/idp/shibboleth,
    with SAML 2.0 SSO endpoints under sso.purdue.edu. The IdP is registered in InCommon and therefore
    reachable through eduGAIN; its metadata is served publicly and unauthenticated from Purdue's own host
    and signed from the InCommon metadata query service, where the entity carries OrganizationName "Purdue
    University Main Campus". This is the most defensible institution-operated machine-readable surface
    Purdue publishes - it is institution-run by definition, it is a standard the education regime names,
    and it is almost never catalogued.
  humanURL: https://incommon.org/federation/
  baseURL: https://sso.purdue.edu/idp
  tags:
