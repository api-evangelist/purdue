aid: purdue
name: Purdue University
x-type: university
x-category: Public Research University
description: >-
  Purdue University is a public land-grant research university in West Lafayette, Indiana, United
  States, a member of the Association of American Universities and the Big Ten Academic Alliance.
  Purdue operates no central developer portal, no API gateway and no self-service key issuance, and
  its programmable footprint is small, scattered across service units, and almost entirely
  undocumented. Four surfaces were confirmed institution-operated by live probe: the Rosen Center
  for Advanced Computing (RCAC) publishes its own OpenAPI 3.0 document at www.rcac.purdue.edu/api
  covering 206 paths and 452 operations behind Purdue Web Authentication; Housing and Food Services
  runs an open, keyless dining menus API at api.hfs.purdue.edu/menus/v2; the Purdue University
  Research Repository exposes an OAI-PMH 2.0 endpoint at purr.purdue.edu/oaipmh; and Purdue runs
  its own Shibboleth identity provider, registered in InCommon, whose SAML 2.0 metadata is public.
  Three further surfaces are recorded as tenant relationships, not Purdue engineering - Purdue
  e-Pubs on bepress Digital Commons, the events calendar on Localist, and the community-built
  Purdue.io course-catalog API, which runs on a privately registered domain and DigitalOcean
  hosting with no evidence of institutional operation or endorsement. The Purdue Libraries API host
  resolves but has served only a placeholder page since at least June 2026.
