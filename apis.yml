apis:
- aid: purdue:purdue-rcac-api
  name: Purdue RCAC API
  x-operator: institution
  description: >-
    The Rosen Center for Advanced Computing publishes its own OpenAPI 3.0.0 description at
    www.rcac.purdue.edu/api - 206 paths and 452 operations covering research computing groups and
    their members, departments and fields of science, course allocations and enrollments, staff
    contact reports, and the RCAC service finder with its facets and facet tree. This is Purdue's
    own software on Purdue's own host (www.rcac.purdue.edu -> web.rcac.purdue.edu, 128.211.157.46),
    and it is the single largest institution-authored machine-readable artifact found anywhere in
    this profile. The contract is public; the endpoints are not - an unauthenticated call returns
    500 with a Purdue Web Authentication login page, and the declared api_token apiKey header has
    no documented self-service issuance. Declared version is 0.0.1 with no stability, deprecation
    or changelog statement.
  humanURL: https://www.rcac.purdue.edu/
  baseURL: https://www.rcac.purdue.edu/api
