- aid: purdue:purr-oaipmh
  name: PURR OAI-PMH Metadata API
  x-operator: institution
  description: >-
    The Purdue University Research Repository exposes an OAI-PMH 2.0 endpoint for harvesting
    research dataset metadata, supporting the standard verbs (Identify, ListSets,
    ListMetadataFormats, ListIdentifiers, ListRecords, GetRecord) with the oai_dc Dublin Core
    prefix. Confirmed live on 2026-08-30 via Identify and ListSets. purr.purdue.edu is on Purdue's
    own netblock and the Identify response names a purdue.edu administrator, so the endpoint is
    institution-operated even though PURR runs on HUBzero - which itself originated at Purdue.
    Purdue mints DataCite DOIs for this repository as a direct DataCite member.
  humanURL: https://purr.purdue.edu/kb/finduse/oaipmh
