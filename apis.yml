  name: Purdue e-Pubs OAI-PMH (bepress Digital Commons tenant)
  x-operator: tenant
  description: >-
    Purdue e-Pubs is the university's institutional repository for scholarly output, reachable at
    docs.lib.purdue.edu with a working OAI-PMH 2.0 endpoint. The content, the collections and the
