- aid: purdue:purdue-events-api
  name: Purdue Events Calendar API (Localist tenant)
  x-operator: tenant
  description: >-
    Purdue's public events calendar at events.purdue.edu serves a live JSON events API on the
    Localist v2 contract. The events are Purdue's; the API is Localist's. events.purdue.edu is a
    CNAME chain to purdue.enterprise.localist.com and the responses carry the vendor's own
    x-slzr-platform header set to "purdue" - a textbook institution-branded tenancy. Recorded as
    a relationship; Localist's generic contract is not stored under this institution. Note that
    calendar.purdue.edu is a separate Purdue-hosted page and does not serve this API.
