- aid: purdue:purdueio-course-catalog-api
  name: Purdue.io Course Catalog API (community-built, third-party)
  x-operator: tenant
  description: >-
    Purdue.io is an OData v4 API over Purdue's course catalog, started in 2015 as a Computer
    Science senior design project and still maintained by its community. It is genuinely useful
    and genuinely about Purdue, but it is not Purdue's engineering and by every check it is not
    Purdue's operation - api.purdue.io resolves to 167.71.242.113 on DigitalOcean rather than
    Purdue's 128.210/128.211 netblocks, purdue.io is privately registered through Porkbun to
    "Private by Design, LLC" in North Carolina rather than to the university, the code is
    MIT-licensed under the independent Purdue-io GitHub organization, and no institutional
    endorsement was found. The June 2026 profile of this repository recorded this single contract
    as ten separate Purdue APIs, one per tag, and credited Purdue with every schema, collection,
    example, rule and vocabulary derived from it; all of that has been removed and the
    relationship kept as this one entry. Purdue's own registrar catalog is a separate,
    non-programmable surface at catalog.purdue.edu.
  humanURL: https://github.com/Purdue-io/PurdueApi
  baseURL: https://api.purdue.io/odata
