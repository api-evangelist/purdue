- aid: purdue:purdue-hfs-dining-menus-api
  name: Purdue HFS Dining Menus API
  x-operator: institution
  description: >-
    A public, keyless HTTP API operated by Purdue University Housing and Food Services at
    api.hfs.purdue.edu, serving dining-court locations, published daily menus by location and
    date, and per-item nutrition and allergen data. The host is Purdue's own web infrastructure
    (CNAME wpvwebasp03-01.www.purdue.edu, 128.210.7.106) and the service identifies itself as
    Purdue.Hfs.Menus.Domain in its own error stack traces, so this is Purdue software on Purdue
    servers rather than a vendor platform behind a Purdue hostname. HFS publishes no
    documentation, no OpenAPI, no terms of use and no rate limit; the contract in this repository
    was written from live probes and is marked generated accordingly.
